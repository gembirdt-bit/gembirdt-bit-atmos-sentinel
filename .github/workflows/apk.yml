# Pravi APK za Atmos Svetlinu.
# Svaka izmena na main → nova verzija u Releases (preuzmi AtmosSentinel.apk).
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_FILE: ${{ github.workspace }}/release.jks
      KEY_ALIAS: atmos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Potpisni ključ
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          else
            echo "::warning::Nema tajni ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD — APK je potpisan PRIVREMENIM ključem."
            PW=privremeni$RANDOM$RANDOM
            keytool -genkeypair -storetype PKCS12 -keystore "$KEYSTORE_FILE" -alias atmos -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Atmos Sentinel test"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/AtmosSentinel.apk

      - uses: actions/upload-artifact@v5
        with:
          name: AtmosSentinel
          path: out/AtmosSentinel.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Atmos Sentinel ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Preuzmi `AtmosSentinel.apk` i instaliraj ga na telefon.
          files: out/AtmosSentinel.apk
